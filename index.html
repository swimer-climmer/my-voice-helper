
<!DOCTYPE html>
<html>
<head>
    <title>My Voice Helper</title>

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #54d6ff;
            font-size: 36px;
        }

        button, select {
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 18px;
            margin: 8px;
        }

        button {
            background: #168cff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0066cc;
        }

        select {
            background: white;
            color: #101827;
        }

        #output {
            font-size: 21px;
            margin-top: 30px;
            line-height: 1.7;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>🎤 My Voice Helper</h1>

    <p>Click the button and talk to me!</p>

    <button id="listen">🎤 Start Talking</button>
    <button id="stop">⏹ Stop</button>

    <br><br>

    <label for="voiceSelect">Choose my voice:</label>

    <select id="voiceSelect"></select>

    <div id="output">Waiting for your voice...</div>

    <script>

        // ELEMENTS

        const listenButton = document.getElementById("listen");
        const stopButton = document.getElementById("stop");
        const output = document.getElementById("output");
        const voiceSelect = document.getElementById("voiceSelect");

        // MEMORY

        let userName = "";
        let userColor = "";
        let userBirthday = "";
        let userAnimal = "";
        let secretNumber = 0;
        let gameActive = false;

        // LISTENING SETTINGS

        let listening = false;
        let speaking = false;

        // VOICES

        let availableVoices = [];

        function loadVoices() {

            availableVoices = window.speechSynthesis.getVoices();

            voiceSelect.innerHTML = "";

            availableVoices.forEach((voice, index) => {

                const option = document.createElement("option");

                option.value = index;

                option.textContent =
                    voice.name + " (" + voice.lang + ")";

                voiceSelect.appendChild(option);

            });

        }

        window.speechSynthesis.onvoiceschanged = loadVoices;

        loadVoices();

        // SPEAKING

        function speak(answer) {

            speaking = true;

            const speech = new SpeechSynthesisUtterance(answer);

            const selectedVoice =
                availableVoices[voiceSelect.value];

            if (selectedVoice) {
                speech.voice = selectedVoice;
            }

            speech.lang = "en-US";

            speech.onend = function() {

                speaking = false;

                if (listening) {
                    setTimeout(startListening, 500);
                }

            };

            speech.onerror = function() {

                speaking = false;

                if (listening) {
                    setTimeout(startListening, 500);
                }

            };

            window.speechSynthesis.speak(speech);

        }

        // ASSISTANT BRAIN

        function getAnswer(words) {

            const message = words.toLowerCase().trim();

            // REMEMBER NAME

            if (message.includes("my name is")) {

                userName = words.substring(
                    message.indexOf("my name is") + 10
                ).trim();

                return "Nice to meet you, " + userName + "!";

            }

            else if (
                message.includes("what is my name") ||
                message.includes("what's my name")
            ) {

                if (userName !== "") {
                    return "Your name is " + userName + "!";
                }

                return "I don't know your name yet!";

            }

// MATH
const mathMatch = message.match(
  /(-?\d+(?:\.\d+)?)\s*(\+|plus|add|minus|-|times|\*|multiplied by|multiply|divided by|divide|\/)\s*(-?\d+(?:\.\d+)?)/
);

if (mathMatch) {
  const a = Number(mathMatch[1]);
  const operation = mathMatch[2];
  const b = Number(mathMatch[3]);
  let result;

  if (operation === "+" || operation === "plus" || operation === "add") {
    result = a + b;
  } else if (operation === "-" || operation === "minus") {
    result = a - b;
  } else if (["times", "*", "multiplied by", "multiply"].includes(operation)) {
    result = a * b;
  } else if (["/", "divided by", "divide"].includes(operation)) {
    if (b === 0) return "You cannot divide by zero!";
    result = a / b;
  }

  return "The answer is " + result + "!";
}
            // DATE AND TIME
if (message.includes("what time")) {
  return "It is " + new Date().toLocaleTimeString() + ".";
}

if (message.includes("what date") || message.includes("today's date")) {
  return "Today is " + new Date().toLocaleDateString() + ".";
}
          // JOKES
if (message.includes("tell me a joke") || message.includes("make me laugh")) {
  const jokes = [
    "Why did the computer go to the doctor? Because it had a virus!",
    "Why was the math book sad? Because it had too many problems!",
    "What do you call a bear with no teeth? A gummy bear!",
    "Why did the robot go on vacation? It needed to recharge!",
    "What is a computer's favorite snack? Microchips!"
  ];

  return jokes[Math.floor(Math.random() * jokes.length)];
}
          // FAVORITE COLOR
if (message.includes("my favorite color is")) {
  userColor = message.split("my favorite color is")[1].trim();
  return "I'll remember that your favorite color is " + userColor + "!";
}

if (message.includes("what is my favorite color")) {
  return userColor
    ? "Your favorite color is " + userColor + "!"
    : "You haven't told me your favorite color yet.";
}
           // COUNTING
if (message.includes("count to")) {
  const number = Number(message.match(/\d+/)?.[0]);

  if (number > 0 && number <= 100) {
    return Array.from(
      { length: number },
      (_, i) => i + 1
    ).join(", ");
  }

  return "Please ask me to count to a number between 1 and 100.";
}
           // COMPLIMENTS
if (message.includes("you are smart")) {
  return "Thank you! I'm getting smarter every day!";
}

if (message.includes("you are funny")) {
  return "Thanks! I try my best to make you laugh!";
}

if (message.includes("i like you")) {
  return "That's so nice of you to say!";
}

if (message.includes("good job")) {
  return "Thank you! I'm proud of my progress!";
}
           
            // GENERAL KNOWLEDGE
if (message.includes("what is a black hole")) {
  return "A black hole is a place in space where gravity is so strong that not even light can escape!";
}

if (message.includes("what is the sun")) {
  return "The Sun is a star at the center of our solar system. It gives Earth light and heat!";
}

if (message.includes("what is an atom")) {
  return "An atom is a tiny building block that makes up everything around us!";
}

if (message.includes("what is gravity")) {
  return "Gravity is a force that pulls objects toward each other. It keeps us on the ground!";
}
           // BIRTHDAY MEMORY
if (message.includes("my birthday is")) {
  userBirthday = message.split("my birthday is")[1].trim();
  return "I'll remember your birthday is " + userBirthday + "!";
}

if (message.includes("when is my birthday")) {
  return userBirthday
    ? "Your birthday is " + userBirthday + "!"
    : "You haven't told me your birthday yet.";
}
           // ANIMAL MEMORY
if (message.includes("my favorite animal is")) {
  userAnimal = message.split("my favorite animal is")[1].trim();
  return "Cool! I'll remember that you like " + userAnimal + "!";
}

if (message.includes("what is my favorite animal")) {
  return userAnimal
    ? "Your favorite animal is " + userAnimal + "!"
    : "You haven't told me your favorite animal yet.";
}
         // GUESSING GAME
if (message.includes("play a guessing game")) {
  secretNumber = Math.floor(Math.random() * 10) + 1;
  gameActive = true;
  return "I'm thinking of a number between 1 and 10. Try to guess it!";
}

if (gameActive) {
  const numberWords = {
    zero: 0, one: 1, two: 2, three: 3, four: 4,
    five: 5, six: 6, seven: 7, eight: 8, nine: 9,
    ten: 10
  };

  const guessMatch = message.match(/\b\d+\b/);
  const spokenGuess = message.trim();

  let guess;

  if (guessMatch) {
    guess = Number(guessMatch[0]);
  } else if (numberWords[spokenGuess] !== undefined) {
    guess = numberWords[spokenGuess];
  } else {
    return "Please guess a number between 1 and 10.";
  }

  if (guess < 1 || guess > 10) {
    return "Pick a number between 1 and 10!";
  }

  if (guess === secretNumber) {
    gameActive = false;
    return "You got it! You win!";
  }

  return guess < secretNumber
    ? "Too low! Guess again!"
    : "Too high! Guess again!";
}
           // COIN FLIP
if (message.includes("flip a coin") || message.includes("toss a coin")) {
  const result = Math.random() < 0.5 ? "heads" : "tails";
  return "The coin landed on " + result + "!";
}
       
           // ROLL DICE
if (message.includes("roll a dice") || message.includes("roll the dice")) {
  const roll = Math.floor(Math.random() * 6) + 1;
  return "You rolled a " + roll + "!";
}
           // ROCK PAPER SCISSORS

if (message.includes("play rock paper scissors")) {
  gameActive = false;
  return "Tell me rock, paper, or scissors!";
}

if (
  ["rock", "paper", "scissors"].includes(message.trim())
) {
  const player = message.trim();
  const choices = ["rock", "paper", "scissors"];
  const computer = choices[Math.floor(Math.random() * 3)];

  if (player === computer) {
    return "I chose " + computer + "! We tied!";
  }

  if (
    (player === "rock" && computer === "scissors") ||
    (player === "paper" && computer === "rock") ||
    (player === "scissors" && computer === "paper")
  ) {
    return "I chose " + computer + "! YOU WIN!";
  }

  return "I chose " + computer + "! I WIN!";
}
         
          // GREETINGS BY TIME
if (message.includes("good morning") ||
    message.includes("good afternoon") ||
    message.includes("good evening")) {

  const hour = new Date().getHours();

  if (hour < 12) return "Good morning! I hope you have a great day!";
  if (hour < 18) return "Good afternoon! How is your day going?";
  return "Good evening! It's nice to talk to you!";
}
            // CONVERSATION

            if (
                message.includes("hello") ||
                message.includes("hi")
            ) {

                return "Hello " + (userName || "friend") + "!";

            }

            if (message.includes("your name")) {

                return "I'm your new voice assistant!";

            }

            if (message.includes("how are you")) {

                return "I'm doing great! How are you?";

            }

            if (message.includes("what time")) {

                return "I don't have a clock yet!";

            }

            if (message.includes("favorite color")) {

                return "My favorite color is blue!";

            }

            if (message.includes("bye")) {

                listening = false;

                return "Goodbye! Talk to you later!";

            }

            return "I don't know that one yet, but I'm learning!";

        }

        // SPEECH RECOGNITION

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        let recognition = null;

        if (!SpeechRecognition) {

            output.textContent =
                "Speech recognition is not supported in this browser.";

            listenButton.disabled = true;

        } else {

            recognition = new SpeechRecognition();

            recognition.lang = "en-US";

            recognition.continuous = false;

            recognition.interimResults = false;

            // START LISTENING

            function startListening() {

                if (!listening || speaking) return;

                try {

                    recognition.start();

                } catch (error) {

                    console.log("Recognition is already starting.");

                }

            }

            listenButton.onclick = function() {

                listening = true;

                output.textContent = "Listening... 🎧";

                startListening();

            };

            // STOP LISTENING

            stopButton.onclick = function() {

                listening = false;

                speaking = false;

                recognition.stop();

                window.speechSynthesis.cancel();

                output.textContent = "Conversation stopped.";

            };

            // WHEN WORDS ARE RECOGNIZED

            recognition.onresult = function(event) {

                const words =
                    event.results[0][0].transcript;

                output.textContent = "You said: " + words;

               
const weatherQuestion = words.toLowerCase();

if (
    weatherQuestion.includes("weather") ||
    weatherQuestion.includes("temperature") ||
    weatherQuestion.includes("will it rain") ||
    weatherQuestion.includes("is it raining")
) {
    output.textContent += "\nAssistant: Checking the weather...";
    getWeather();
    return;
}

const answer = getAnswer(words);

output.textContent +=
    "\nAssistant: " + answer;

speak(answer);


            };

            // MICROPHONE ERRORS

            recognition.onerror = function(event) {

                output.textContent =
                    "Microphone error: " + event.error;

                console.log(
                    "Speech recognition error:",
                    event.error
                );

                if (
                    event.error === "not-allowed" ||
                    event.error === "service-not-allowed"
                ) {
                    listening = false;
                }

            };

            // WHEN LISTENING ENDS

            recognition.onend = function() {

                if (listening && !speaking) {

                    output.textContent =
                        "I stopped hearing you. Trying again...";

                    setTimeout(startListening, 1000);

                }

            };

        }


async function getWeather() {
    output.textContent = "Getting your location...";

    if (!navigator.geolocation) {
        speak("Your browser does not support location services.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async (position) => {
            output.textContent = "Location found! Checking the weather...";

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch(url, {
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error("Weather service error");
                }

                const data = await response.json();
                const current = data.current;

                const temperature = Math.round(current.temperature_2m);
                const feelsLike = Math.round(current.apparent_temperature);
                const humidity = current.relative_humidity_2m;
                const wind = Math.round(current.wind_speed_10m);

                const conditions = {
                    0: "clear skies",
                    1: "mostly clear",
                    2: "partly cloudy",
                    3: "overcast",
                    45: "foggy",
                    48: "foggy",
                    51: "light drizzle",
                    53: "drizzle",
                    55: "heavy drizzle",
                    61: "light rain",
                    63: "rain",
                    65: "heavy rain",
                    71: "light snow",
                    73: "snow",
                    75: "heavy snow",
                    80: "rain showers",
                    81: "rain showers",
                    82: "heavy rain showers",
                    95: "a thunderstorm"
                };

                const description =
                    conditions[current.weather_code] || "changing conditions";

                const answer =
                    `It is ${temperature} degrees with ${description}. ` +
                    `It feels like ${feelsLike} degrees. ` +
                    `Humidity is ${humidity} percent and wind speed is ${wind} miles per hour.`;

                output.textContent = "Assistant: " + answer;
                speak(answer);

            } catch (error) {
                output.textContent = "I couldn't get the weather. Please try again.";
                speak("Sorry, the weather service took too long or isn't responding.");
            } finally {
                clearTimeout(timer);
            }
        },

        (error) => {
            let message = "I couldn't get your location.";

            if (error.code === 1) {
                message = "Please allow location access in your browser.";
            } else if (error.code === 3) {
                message = "Your location took too long to load. Please try again.";
            }

            output.textContent = message;
            speak(message);
        },

        {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 300000
        }
    );
}

    </script>

</body>
</html>
